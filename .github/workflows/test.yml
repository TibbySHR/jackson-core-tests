name: Maven tests and coverage report with multiple JVM flags

on:
  pull_request:
  push:

jobs: 
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jvm_flags: [
          "-Xmx512m",
          "-XX:+AlwaysPreTouch",
          "-XX:+UseG1GC",
          "-XX:+UseStringDeduplication",
          "-XX:+UnlockExperimentalVMOptions -XX:+UseCompressedOops"
        ]
        common_jvm_flags_logs: [ "-XX:+UnlockDiagnosticVMOptions -Xlog:gc*:file=jvm.log:time,level,tags -XX:+PrintFlagsFinal" ]

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4
      
      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Set environment variables for JVM flags and logs
      - name: Set environment variables
        run: |
          echo "MAVEN_OPTS=${{ matrix.jvm_flags }} ${{ matrix.common_jvm_flags_logs }}" >> $GITHUB_ENV
        shell: bash

      # Sanitize the JVM flag for artifact names
      - name: Sanitize JVM Flag
        id: sanitize
        run: |
          sanitized_flag=$(echo "${{ matrix.jvm_flags }}" | sed 's/[:+]/_/g')
          echo "sanitized_flag=$sanitized_flag" >> $GITHUB_ENV

      # Run Maven tests with different JVM flags and generate JaCoCo coverage report
      - name: Run Maven tests with JVM Flag and generate coverage report
        
        env:
          MAVEN_OPTS: "${{ matrix.jvm_flags }} ${{ matrix.common_jvm_flags_logs }}"
        run: |
          echo "Running tests with JVM flag: ${{ matrix.jvm_flags }}"
          xvfb-run mvn clean verify jacoco:report -Pcoverage

      # JaCoCo Coverage Report
      - name: Get JaCoCo Coverage Report
        id: coverage
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv)
          echo "COVERAGE=$coverage" >> $GITHUB_ENV
        

      # Fail if coverage has not improved
      - name: Fail if coverage has not improved.
        run: |
          coverage=$COVERAGE
          threshold=81.58
          if (( $(echo "$coverage - $threshold <= 0.1" | bc -l) )); then 
            echo "Coverage is not improved."
            exit 1
          else
            echo "New coverage: $coverage%. Coverage is improved!"
          fi
       

      # Upload JaCoCo Coverage Report
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report-${{ env.sanitized_flag }}
          path: target/site/jacoco/  # Path to the JaCoCo report

      # Save test logs
      - name: Save Test Logs
        run: |
          mkdir -p logs
          mv target/surefire-reports/*.txt logs/
        if: always()

      # Upload the logs as an artifact for each JVM flag with sanitized name
      - name: Upload Test Logs
        uses: actions/upload-artifact@v3
        with:
          name: test-logs-${{ env.sanitized_flag }}
          path: logs/

      # Display JVM Log
      - name: Display JVM Log
        if: always()
        run: cat jvm.log
     
